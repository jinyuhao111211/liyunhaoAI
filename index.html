<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI 聊天室</title>
<style>
  :root {
    --bg: #f3f4f8;
    --surface: #ffffff;
    --surface-2: #f7f8fc;
    --border: #e6e8f0;
    --border-strong: #d6dae6;
    --text: #15171e;
    --text-2: #5a6273;
    --text-3: #8f97a8;
    --brand: #5b5bd6;
    --brand-2: #8b5cf6;
    --brand-soft: #eef0ff;
    --danger: #dc2626;
    --ok: #16a34a;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(16, 18, 28, .04);
    --shadow: 0 2px 6px rgba(16, 18, 28, .05), 0 16px 40px -24px rgba(16, 18, 28, .25);
    --mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  ::selection { background: #d9dbff; }

  /* ---------------- layout ---------------- */
  .app { display: flex; height: 100vh; overflow: hidden; }

  .sidebar {
    width: 332px;
    flex: 0 0 332px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left .3s cubic-bezier(.4, 0, .2, 1);
    z-index: 40;
  }
  .app.sidebar-hidden .sidebar { margin-left: -332px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 18px 20px 16px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 11px;
    background: linear-gradient(140deg, #6366f1, #a855f7);
    display: grid; place-items: center;
    color: #fff;
    box-shadow: 0 6px 16px -6px rgba(99, 102, 241, .8);
    flex: 0 0 auto;
  }
  .brand-text { min-width: 0; }
  .brand-name { font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
  .brand-sub { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-body {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 8px;
  }

  .panel { padding: 14px 0 16px; border-top: 1px solid var(--border); }
  .panel:first-child { border-top: none; }

  .panel-title {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 10px;
  }

  .segmented {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 3px;
    background: #eef0f6;
    border-radius: 11px;
  }
  .segmented button {
    padding: 6px 4px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 550;
    color: var(--text-2);
    transition: .16s;
  }
  .segmented button:hover { color: var(--text); }
  .segmented button.active {
    background: var(--surface);
    color: var(--brand);
    box-shadow: var(--shadow-sm);
  }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field-label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
    margin-bottom: 6px;
  }
  .field-label .hint-btn {
    font-size: 11.5px; color: var(--brand); font-weight: 550;
    padding: 2px 6px; border-radius: 6px; transition: .15s;
  }
  .field-label .hint-btn:hover { background: var(--brand-soft); }

  .input-wrap { position: relative; display: flex; align-items: center; }
  input[type="text"], input[type="password"], textarea, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 13px;
    outline: none;
    transition: border-color .16s, box-shadow .16s, background .16s;
  }
  input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
    border-color: #b9bcf5;
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .12);
  }
  input::placeholder, textarea::placeholder { color: #a8aebd; }
  textarea { resize: none; line-height: 1.55; }

  .input-wrap input { padding-right: 38px; }
  .eye-btn {
    position: absolute; right: 6px;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 7px; color: var(--text-3);
  }
  .eye-btn:hover { background: #e9ebf4; color: var(--text-2); }

  .range-row { display: flex; align-items: center; gap: 10px; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--brand) 0%, var(--brand) var(--p, 47%), #e3e6f0 var(--p, 47%), #e3e6f0 100%);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand);
    box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
    cursor: pointer;
  }
  .range-val {
    font-family: var(--mono); font-size: 12px; color: var(--text-2);
    min-width: 30px; text-align: right;
  }

  .btn-row { display: flex; gap: 8px; margin-top: 14px; }

  .btn {
    flex: 1;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: .16s;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    box-shadow: 0 6px 16px -8px rgba(99, 102, 241, .9);
  }
  .btn-primary:hover { filter: brightness(1.06); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: .6; cursor: default; transform: none; filter: none; }
  .btn-ghost {
    background: var(--surface-2);
    border-color: var(--border);
    color: var(--text-2);
  }
  .btn-ghost:hover { background: #eef0f7; color: var(--text); }

  .status-line {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-3);
    margin-top: 10px; min-height: 18px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c3c8d6; flex: 0 0 auto; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(22, 163, 74, .14); }
  .dot.err { background: var(--danger); box-shadow: 0 0 0 3px rgba(220, 38, 38, .13); }
  .dot.busy { background: #f59e0b; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* ---------------- shared api card ---------------- */
  .sidebar-foot {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(247, 248, 252, 0) 0%, rgba(247, 248, 252, .9) 100%);
  }
  .shared-card {
    border: 1px solid #e2e2fb;
    background: linear-gradient(160deg, #f6f6ff, #fbf7ff);
    border-radius: 13px;
    padding: 12px 13px;
  }
  .shared-head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .shared-head .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    color: #fff; background: linear-gradient(135deg, #6366f1, #a855f7);
    padding: 2px 6px; border-radius: 5px;
  }
  .shared-title { font-size: 13px; font-weight: 650; }
  .shared-desc { font-size: 11.5px; color: var(--text-3); line-height: 1.5; margin-bottom: 9px; }
  .shared-meta {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-2);
    background: rgba(255, 255, 255, .75);
    border: 1px solid #eaeafc;
    border-radius: 7px;
    padding: 5px 7px;
    margin-bottom: 9px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .shared-card .btn { width: 100%; padding: 8px 10px; font-size: 12.5px; }

  /* ---------------- main ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

  .topbar {
    height: 58px;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, .82);
    backdrop-filter: saturate(180%) blur(12px);
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: grid; place-items: center;
    color: var(--text-2);
    transition: .15s;
  }
  .icon-btn:hover { background: #eceef6; color: var(--text); }

  .model-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 999px;
    max-width: 320px;
  }
  .model-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spacer { flex: 1; }

  .top-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--text-2);
    padding: 6px 11px; border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    transition: .15s;
  }
  .top-btn:hover { border-color: var(--border-strong); color: var(--text); box-shadow: var(--shadow-sm); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 18px 10px;
    scroll-behavior: smooth;
  }
  .messages-inner { max-width: 820px; margin: 0 auto; }

  /* empty state */
  .empty { text-align: center; padding: 8vh 10px 0; animation: fadeUp .5s ease both; }
  .empty-icon {
    width: 62px; height: 62px; margin: 0 auto 18px;
    border-radius: 19px;
    background: linear-gradient(140deg, #6366f1, #a855f7);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 16px 34px -16px rgba(99, 102, 241, .95);
  }
  .empty h1 { font-size: 22px; font-weight: 680; letter-spacing: -.02em; margin: 0 0 8px; }
  .empty p { color: var(--text-2); font-size: 13.5px; margin: 0 auto 22px; max-width: 430px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; max-width: 560px; margin: 0 auto; }
  .chip {
    font-size: 12.5px;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 13px;
    border-radius: 999px;
    transition: .16s;
    text-align: left;
  }
  .chip:hover { border-color: #c7c9f7; color: var(--brand); background: #fafaff; transform: translateY(-1px); }

  /* messages */
  .msg { display: flex; gap: 11px; margin-bottom: 22px; animation: fadeUp .32s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .msg-user { justify-content: flex-end; }
  .msg-user .bubble {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    border-radius: 16px 16px 5px 16px;
    padding: 10px 15px;
    max-width: 78%;
    box-shadow: 0 8px 20px -14px rgba(99, 102, 241, .95);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .avatar {
    width: 28px; height: 28px; flex: 0 0 28px;
    border-radius: 9px;
    background: linear-gradient(140deg, #6366f1, #a855f7);
    display: grid; place-items: center;
    color: #fff;
    margin-top: 2px;
    box-shadow: 0 5px 14px -8px rgba(99, 102, 241, .9);
  }
  .msg-body { min-width: 0; max-width: calc(100% - 39px); }
  .msg-ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px 16px 16px 16px;
    padding: 11px 15px;
    box-shadow: var(--shadow-sm);
    word-break: break-word;
  }
  .msg-ai.error .bubble {
    border-color: #f3c9c9;
    background: #fff7f7;
    color: #b42318;
  }

  .bubble p { margin: 0 0 10px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
    margin: 14px 0 8px; font-size: 14.5px; font-weight: 650; line-height: 1.4;
  }
  .bubble h3:first-child, .bubble h4:first-child { margin-top: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 10px; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble code {
    font-family: var(--mono);
    font-size: 12.5px;
    background: #eef0f7;
    padding: 1.5px 5px;
    border-radius: 5px;
    color: #3b3f6b;
  }
  .bubble pre {
    margin: 10px 0;
    background: #14161f;
    border-radius: 11px;
    padding: 12px 14px;
    overflow-x: auto;
  }
  .bubble pre code {
    background: none; padding: 0; color: #e7e9f5;
    font-size: 12.5px; line-height: 1.65;
    white-space: pre;
  }
  .bubble strong { font-weight: 650; }
  .bubble a { color: var(--brand); text-decoration: underline; text-underline-offset: 2px; }

  .msg-actions {
    display: flex; gap: 4px;
    margin-top: 6px;
    opacity: 0;
    transition: opacity .18s;
  }
  .msg-ai:hover .msg-actions { opacity: 1; }
  .mini-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; color: var(--text-3);
    padding: 3px 7px; border-radius: 6px;
    transition: .15s;
  }
  .mini-btn:hover { background: #eceef6; color: var(--text-2); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #b6bccd;
    animation: bounce 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .16s; }
  .typing i:nth-child(3) { animation-delay: .32s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }

  .caret {
    display: inline-block;
    width: 7px; height: 15px;
    background: var(--brand);
    border-radius: 2px;
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* composer */
  .composer { padding: 8px 18px 14px; }
  .composer-inner { max-width: 820px; margin: 0 auto; }
  .composer-box {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 8px 8px 8px 15px;
    box-shadow: var(--shadow);
    transition: border-color .18s, box-shadow .18s;
  }
  .composer-box:focus-within {
    border-color: #c3c5f8;
    box-shadow: 0 2px 8px rgba(99, 102, 241, .1), 0 18px 44px -26px rgba(99, 102, 241, .7);
  }
  #input {
    flex: 1;
    border: none;
    background: none;
    padding: 7px 0;
    max-height: 168px;
    font-size: 14.5px;
    line-height: 1.55;
  }
  #input:focus { box-shadow: none; border: none; background: none; }

  .send-btn {
    width: 38px; height: 38px; flex: 0 0 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff;
    display: grid; place-items: center;
    transition: .18s;
    box-shadow: 0 8px 18px -10px rgba(99, 102, 241, 1);
  }
  .send-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .send-btn:disabled {
    background: #e3e6f0; color: #a9b0c0;
    box-shadow: none; cursor: default; transform: none;
  }
  .send-btn.stop { background: #1f2430; }

  .composer-note {
    text-align: center;
    font-size: 11px;
    color: var(--text-3);
    margin-top: 9px;
  }

  /* toast */
  .toast-wrap {
    position: fixed; left: 50%; bottom: 26px;
    transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px;
    align-items: center;
    z-index: 100;
    pointer-events: none;
  }
  .toast {
    background: #1d2130;
    color: #fff;
    font-size: 12.5px;
    padding: 9px 15px;
    border-radius: 10px;
    box-shadow: 0 12px 30px -12px rgba(0, 0, 0, .5);
    animation: toastIn .24s ease both;
    max-width: 88vw;
  }
  .toast.out { animation: toastOut .22s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(.98); } }

  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(16, 18, 28, .32);
    z-index: 35;
    backdrop-filter: blur(2px);
  }

  /* scrollbar */
  .sidebar-body::-webkit-scrollbar, .messages::-webkit-scrollbar { width: 9px; }
  .sidebar-body::-webkit-scrollbar-thumb, .messages::-webkit-scrollbar-thumb {
    background: #d8dce8; border-radius: 9px; border: 2px solid transparent; background-clip: content-box;
  }
  .sidebar-body::-webkit-scrollbar-thumb:hover, .messages::-webkit-scrollbar-thumb:hover { background: #c3c9d8; background-clip: content-box; }

  @media (max-width: 880px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      margin-left: 0 !important;
      transform: translateX(-100%);
      transition: transform .3s cubic-bezier(.4, 0, .2, 1);
      box-shadow: 0 0 60px rgba(16, 18, 28, .18);
      width: 88vw; max-width: 332px; flex-basis: auto;
    }
    .app.sidebar-open .sidebar { transform: translateX(0); }
    .app.sidebar-open .overlay { display: block; }
    .messages { padding: 20px 13px 8px; }
    .composer { padding: 8px 13px 12px; }
    .msg-user .bubble { max-width: 88%; }
    .model-chip { max-width: 150px; }
    .empty { padding-top: 5vh; }
    .empty h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- ============ sidebar ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 4.9L19 9.8l-4.2 3.1L15.6 18 12 15.3 8.4 18l.8-5.1L5 9.8l5.1-1.9L12 3z"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name" data-i18n="app.name">AI 聊天室</div>
        <div class="brand-sub" data-i18n="app.tagline">与任意 AI 模型自由对话</div>
      </div>
    </div>

    <div class="sidebar-body">
      <!-- language -->
      <section class="panel">
        <div class="panel-title" data-i18n="settings.language">语言</div>
        <div class="segmented" id="langSwitch">
          <button type="button" data-lang="zh-CN">简体</button>
          <button type="button" data-lang="en">English</button>
          <button type="button" data-lang="zh-TW">繁體</button>
        </div>
      </section>

      <!-- api settings -->
      <section class="panel">
        <div class="panel-title" data-i18n="settings.api">API 设置</div>

        <div class="field">
          <div class="field-label">
            <span data-i18n="settings.baseUrl">服务地址</span>
          </div>
          <input type="text" id="baseUrl" spellcheck="false" autocomplete="off"
                 data-i18n-ph="settings.baseUrlPh" placeholder="https://apihub.agnes-ai.com/v1" />
        </div>

        <div class="field">
          <div class="field-label">
            <span data-i18n="settings.apiKey">API 密钥</span>
          </div>
          <div class="input-wrap">
            <input type="password" id="apiKey" spellcheck="false" autocomplete="off"
                   data-i18n-ph="settings.apiKeyPh" placeholder="sk-..." />
            <button type="button" class="eye-btn" id="eyeBtn" data-i18n-title="settings.showKey" title="显示密钥">
              <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <div class="field-label">
            <span data-i18n="settings.model">模型</span>
            <button type="button" class="hint-btn" id="fetchModels" data-i18n="settings.fetchModels">获取模型列表</button>
          </div>
          <input type="text" id="model" list="modelList" spellcheck="false" autocomplete="off"
                 data-i18n-ph="settings.modelPh" placeholder="选择或输入模型名" />
          <datalist id="modelList"></datalist>
        </div>

        <div class="field">

  /* ---------------------------------------------------------------
   * 轻量 Markdown 渲染
   * ------------------------------------------------------------- */
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function inlineMd(s) {
    var out = escapeHtml(s);
    out = out.replace(/`([^`\n]+)`/g, function (m, c) { return "<code>" + c + "</code>"; });
    out = out.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
    out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    out = out.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return out;
  }

  function renderTextBlock(text) {
    var lines = text.split("\n");
    var html = "";
    var listType = null; // 'ul' | 'ol'

    function closeList() {
      if (listType) { html += "</" + listType + ">"; listType = null; }
    }

    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var trimmed = line.trim();

      if (trimmed === "") { closeList(); continue; }

      var mUl = /^[-*+]\s+(.*)$/.exec(trimmed);
      var mOl = /^(\d+)[.)]\s+(.*)$/.exec(trimmed);
      var mH = /^(#{1,4})\s+(.*)$/.exec(trimmed);
      var mQuote = /^>\s?(.*)$/.exec(trimmed);

      if (mUl) {
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += "<li>" + inlineMd(mUl[1]) + "</li>";
        continue;
      }
      if (mOl) {
        if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
        html += "<li>" + inlineMd(mOl[2]) + "</li>";
        continue;
      }
      closeList();

      if (mH) {
        var lvl = Math.min(mH[1].length + 2, 6);
        html += "<h" + lvl + ">" + inlineMd(mH[2]) + "</h" + lvl + ">";
      } else if (mQuote) {
        html += "<p style=\"border-left:3px solid #e0e2f0;padding-left:10px;color:#5a6273\">" +
          inlineMd(mQuote[1]) + "</p>";
      } else {
        html += "<p>" + inlineMd(trimmed) + "</p>";
      }
    }
    closeList();
    return html;
  }

  function renderMarkdown(text) {
    var parts = String(text).split("```");
    var html = "";
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        var seg = parts[i];
        var nl = seg.indexOf("\n");
        var lang = "";
        var code = seg;
        if (nl >= 0) {
          var first = seg.slice(0, nl).trim();
          if (/^[a-zA-Z0-9+#._-]{0,20}$/.test(first)) {
            lang = first;
            code = seg.slice(nl + 1);
          }
        }
        code = code.replace(/\n+$/, "");
        html += '<pre><code>' + escapeHtml(code) + "</code></pre>";
      } else {
        html += renderTextBlock(parts[i]);
      }
    }
    return html;
  }

    bubble.className = "bubble";
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

    var actions = document.createElement("div");
    actions.className = "msg-actions";

    body.appendChild(bubble);
    body.appendChild(actions);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    messagesInner.appendChild(wrap);
    scrollToBottom(true);

    return { wrap: wrap, bubble: bubble, actions: actions };
  }

  function setBubbleContent(node, text, streaming) {
    var html = renderMarkdown(text);
    if (streaming) html += '<span class="caret"></span>';
    node.bubble.innerHTML = html;
  }

  function attachActions(node, text) {
    node.actions.innerHTML = "";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "mini-btn";
    btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICON_COPY + "</svg><span>" + escapeHtml(t("chat.copy")) + "</span>";
    btn.addEventListener("click", function () {
      copyText(text, function (ok) {
        if (ok) toast(t("chat.copied"));
      });
    });
    node.actions.appendChild(btn);
  }

  function copyText(text, cb) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { fallback(); });
    } else {
      fallback();
    }
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        cb(ok);
      } catch (e) { cb(false); }
    }
  }

  function renderAllMessages() {
    hideEmpty();
    messagesInner.innerHTML = "";
    if (!history.length) {
      // 重建空状态
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.id = "empty";
      empty.innerHTML =
        '<div class="empty-icon"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-3.8-.8L3 21l1.9-5a8.2 8.2 0 0 1-.9-3.7 8.4 8.4 0 0 1 8.5-8.3 8.4 8.4 0 0 1 8.5 8.3z"/></svg></div>' +
        '<h1 data-i18n="chat.emptyTitle">' + escapeHtml(t("chat.emptyTitle")) + "</h1>" +
        '<p data-i18n="chat.emptyDesc">' + escapeHtml(t("chat.emptyDesc")) + "</p>" +
        '<div class="chips">' +
        '<button type="button" class="chip" data-i18n="chat.tip1">' + escapeHtml(t("chat.tip1")) + "</button>" +
        '<button type="button" class="chip" data-i18n="chat.tip2">' + escapeHtml(t("chat.tip2")) + "</button>" +
        '<button type="button" class="chip" data-i18n="chat.tip3">' + escapeHtml(t("chat.tip3")) + "</button>" +
        "</div>";
      messagesInner.appendChild(empty);
      emptyEl = empty;
      return;
    }
    history.forEach(function (m) {
      if (m.role === "user") {
        addUserMessage(m.content);
      } else {
        var node = addAiMessage();
        setBubbleContent(node, m.content, false);
        attachActions(node, m.content);
      }
    });
    scrollToBottom(true);
  }

  /* ---------------------------------------------------------------
   * Toast
   * ------------------------------------------------------------- */
  function toast(msg) {
    var wrap = $("toastWrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 240);
    }, 2400);
  }

  /* ---------------------------------------------------------------
   * 状态提示
   * ------------------------------------------------------------- */
  function setStatus(state, text) {
    statusDot.className = "dot" + (state === "ok" ? " ok" : state === "err" ? " err" : state === "busy" ? " busy" : "");
    statusText.setAttribute("data-state", state);
    statusText.textContent = text;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.classList.toggle("stop", v);
    sendBtn.setAttribute("title", t(v ? "chat.stop" : "chat.send"));
    sendIcon.innerHTML = v ? ICON_STOP : ICON_SEND;
    updateSendState();
  }

  function updateSendState() {
    if (busy) { sendBtn.disabled = false; return; }
    sendBtn.disabled = inputEl.value.trim().length === 0;
  }

  /* ---------------------------------------------------------------
   * 网络
   * ------------------------------------------------------------- */
  function normalizeBase(url) {
    var u = (url || "").trim();
    if (!u) return "";
    u = u.replace(/\s+/g, "");
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    u = u.replace(/\/+$/, "");
    // 允许用户直接粘贴到 /chat/completions 的地址
    u = u.replace(/\/chat\/completions$/i, "");
    return u;
  }

  function readConfigFromUI() {
    cfg.baseUrl = $("baseUrl").value.trim();
    cfg.apiKey = $("apiKey").value.trim();
    cfg.model = $("model").value.trim();
    cfg.system = $("system").value.trim();
    cfg.temperature = parseFloat($("temperature").value) || 0;
    saveConfig();
    $("modelBadge").textContent = cfg.model || "—";
  }

  function buildMessages() {
    var msgs = [];
    if (cfg.system) msgs.push({ role: "system", content: cfg.system });
    history.forEach(function (m) { msgs.push({ role: m.role, content: m.content }); });
    return msgs;
  }

  async function requestChat(stream, onDelta) {
    var base = normalizeBase(cfg.baseUrl);
    if (!base) throw { kind: "config", message: t("err.noUrl") };
    if (!cfg.apiKey) throw { kind: "config", message: t("err.noKey") };

    var payload = {
      model: cfg.model || SHARED.model,
      messages: buildMessages(),
      temperature: cfg.temperature,
      stream: !!stream
    };

    var res;
    try {
      res = await fetch(base + "/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + cfg.apiKey
        },
        body: JSON.stringify(payload),
        signal: controller ? controller.signal : undefined
      });
    } catch (e) {
      if (e && e.name === "AbortError") throw { kind: "abort" };
      throw { kind: "network", message: t("err.network") };
    }

    if (!res.ok) {
      var detail = "";
      try {
        var txt = await res.text();
        try {
          var j = JSON.parse(txt);
          detail = (j.error && (j.error.message || j.error.code)) || j.message || txt.slice(0, 200);
        } catch (e2) { detail = txt.slice(0, 200); }
      } catch (e3) {}
      throw {
        kind: "http",
        message: t("err.http") + " " + res.status + (detail ? " · " + detail : "")
      };
    }

    var ctype = (res.headers.get("content-type") || "").toLowerCase();

    // 非流式响应（服务端不支持 stream 时兜底）
    if (!stream || ctype.indexOf("text/event-stream") === -1) {
      var data = await res.json();
      var content = data && data.choices && data.choices[0] &&
        data.choices[0].message && data.choices[0].message.content;
      if (content) onDelta(content);
      return;
    }

    var reader = res.body.getReader();
    var decoder = new TextDecoder("utf-8");
    var buffer = "";
    var got = false;
    var finished = false;
    var idleTimer = null;

    function readChunk() {
      return new Promise(function (resolve, reject) {
        idleTimer = setTimeout(function () {
          reject({ kind: "timeout", message: "" });
        }, 25000);
        reader.read().then(function (c) {
          clearTimeout(idleTimer);
          resolve(c);
        }, function (e) {
          clearTimeout(idleTimer);
          reject(e);
        });
      });
    }

    while (true) {
      var chunk;
      try {
        chunk = await readChunk();
      } catch (e0) {
        if (e0 && e0.kind === "timeout") throw e0;
        throw { kind: "network", message: t("err.network") };
      }
      if (chunk.done) break;
      buffer += decoder.decode(chunk.value, { stream: true });

      var idx;
      while ((idx = buffer.indexOf("\n")) >= 0) {
        var line = buffer.slice(0, idx).replace(/\r$/, "").trim();
        buffer = buffer.slice(idx + 1);
        if (!line || line.charAt(0) === ":") continue;
        if (line.indexOf("data:") !== 0) continue;
        var dataStr = line.slice(5).trim();
        if (dataStr === "[DONE]") return;
        var parsed;
        try { parsed = JSON.parse(dataStr); } catch (e4) { continue; }
        var choice = parsed.choices && parsed.choices[0];
        if (!choice) continue;
        var delta = choice.delta ? choice.delta.content : null;
        if (delta) { got = true; onDelta(delta); }
        if (choice.finish_reason) finished = true;
      }

      if (finished) {
        try { reader.cancel(); } catch (e6) {}
        return;
      }
    }
    if (!got) throw { kind: "empty", message: t("err.empty") };
  }

  /* ---------------------------------------------------------------
   * 发送流程
   * ------------------------------------------------------------- */
  async function sendMessage() {
    if (busy) return;
    var text = inputEl.value.trim();
    if (!text) return;

    readConfigFromUI();
    if (!cfg.apiKey) { toast(t("err.noKey")); return; }
    if (!normalizeBase(cfg.baseUrl)) { toast(t("err.noUrl")); return; }

    inputEl.value = "";
    autoGrow();
    updateSendState();

    history.push({ role: "user", content: text });
    addUserMessage(text);

    var node = addAiMessage();
    var acc = "";
    var raf = null;
    var streaming = true;

    function paint() {
      if (raf || !streaming) return;
      raf = requestAnimationFrame(function () {
        raf = null;
        if (!streaming) return;
        setBubbleContent(node, acc || "", true);
        scrollToBottom(false);
      });
    }

    function stopPaint() {
      streaming = false;
      if (raf) { cancelAnimationFrame(raf); raf = null; }
    }

    function finalize() {
      stopPaint();
      setBubbleContent(node, acc, false);
      attachActions(node, acc);
      history.push({ role: "assistant", content: acc });
      saveHistory();
      setStatus("ok", t("settings.ok"));
    }

    controller = new AbortController();
    setBusy(true);
    hasChatted = true;

    try {
      await requestChat(true, function (delta) {
        acc += delta;
        paint();
      });
      if (!acc) throw { kind: "empty", message: t("err.empty") };
      finalize();
    } catch (err) {
      var kind = err && err.kind;
      // 已经收到部分内容（用户停止 / 空闲超时 / 连接中断）：按正常回复收尾
      if (acc && (kind === "abort" || kind === "timeout" || kind === "network")) {
        finalize();
        if (kind === "abort") toast(t("err.stopped"));
      } else if (kind === "abort") {
        stopPaint();
        if (node.wrap.parentNode) node.wrap.parentNode.removeChild(node.wrap);
        // 没有收到任何内容时，用户消息也一起回滚
        if (history.length && history[history.length - 1].role === "user") {
          history.pop();
          var last = messagesInner.lastElementChild;
          if (last && last.classList.contains("msg-user") && last.parentNode) {
            last.parentNode.removeChild(last);
          }
        }
        saveHistory();
        toast(t("err.stopped"));
      } else {
        stopPaint();
        var msg = (err && err.message) || t("err.network");
        node.wrap.classList.add("error");
        node.bubble.innerHTML = "";
        node.bubble.textContent = msg;
        setStatus("err", t("settings.fail"));
        saveHistory();
      }
      scrollToBottom(true);
    } finally {
      setBusy(false);
      controller = null;
      updateSendState();
    }
  }

  /* ---------------------------------------------------------------
   * 设置相关交互
   * ------------------------------------------------------------- */
  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 168) + "px";
  }

  function syncTempUI() {
    var v = parseFloat($("temperature").value);
    $("tempVal").textContent = v.toFixed(1);
    var p = Math.max(0, Math.min(100, (v / 1.5) * 100));
    $("temperature").style.setProperty("--p", p + "%");
  }

  async function fetchModels() {
    readConfigFromUI();
    var base = normalizeBase(cfg.baseUrl);
    if (!base) { toast(t("err.noUrl")); return; }
    var btn = $("fetchModels");
    var old = btn.textContent;
    btn.disabled = true;
    btn.textContent = t("settings.testing");
    setStatus("busy", t("settings.testing"));
    try {
      var res = await fetch(base + "/models", {
        headers: { "Authorization": "Bearer " + cfg.apiKey }
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var list = (data && (data.data || data.models)) || [];
      var ids = list.map(function (m) { return m && (m.id || m.name); }).filter(Boolean);
      if (!ids.length) throw new Error("empty");
      var dl = $("modelList");
      dl.innerHTML = "";
      ids.forEach(function (id) {
        var opt = document.createElement("option");
        opt.value = id;
        dl.appendChild(opt);
      });
      setStatus("ok", t("settings.ok") + " · " + t("settings.modelCount", { n: ids.length }));
      toast(t("settings.modelCount", { n: ids.length }));
      if (!cfg.model && ids.length) {
        $("model").value = ids[0];
        readConfigFromUI();
      }
    } catch (e) {
      setStatus("err", t("settings.fail"));
      toast(t("err.network"));
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  async function testConnection() {
    readConfigFromUI();
    var base = normalizeBase(cfg.baseUrl);
    if (!base) { toast(t("err.noUrl")); return; }
    if (!cfg.apiKey) { toast(t("err.noKey")); return; }

    var btn = $("testBtn");
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = t("settings.testing");
    setStatus("busy", t("settings.testing"));

    try {
      var res = await fetch(base + "/models", {
        headers: { "Authorization": "Bearer " + cfg.apiKey }
      });
      if (!res.ok) {
        var detail = "";
        try { detail = "HTTP " + res.status; } catch (e2) {}
        throw new Error(detail);
      }
      setStatus("ok", t("settings.ok"));
      toast(t("settings.ok") + " · " + (cfg.model || ""));
    } catch (e) {
      setStatus("err", t("settings.fail") + (e && e.message ? " · " + e.message : ""));
      toast(t("settings.fail"));
    } finally {
      btn.disabled = false;
      btn.textContent = old;
    }
  }

  function fillShared() {
    $("baseUrl").value = SHARED.baseUrl;
    $("apiKey").value = SHARED.apiKey;
    $("model").value = SHARED.model;
    readConfigFromUI();
    setStatus("idle", t("settings.notTested"));
    statusText.textContent = t("settings.notTested");
    toast(t("shared.filled"));
    fetchModels();
  }

  function newChat() {
    if (busy && controller) controller.abort();
    history = [];
    saveHistory();
    messagesInner.innerHTML = "";
    emptyEl = null;
    renderAllMessages();
    applyLang(cfg.lang);
    toast(t("chat.cleared"));
  }

  /* ---------------------------------------------------------------
   * 事件绑定
   * ------------------------------------------------------------- */
  $("langSwitch").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b) return;
    applyLang(b.getAttribute("data-lang"));
    // 空状态里的示例按钮文案由 applyLang 统一处理
  });

  $("eyeBtn").addEventListener("click", function () {
    var el = $("apiKey");
    el.type = el.type === "password" ? "text" : "password";
  });

  $("fetchModels").addEventListener("click", fetchModels);
  $("testBtn").addEventListener("click", testConnection);
  $("fillShared").addEventListener("click", fillShared);
  $("newChatBtn").addEventListener("click", newChat);

  $("temperature").addEventListener("input", function () {
    syncTempUI();
    readConfigFromUI();
  });

  ["baseUrl", "apiKey", "model", "system"].forEach(function (id) {
    $(id).addEventListener("change", readConfigFromUI);
    $(id).addEventListener("blur", readConfigFromUI);
  });

  $("model").addEventListener("input", function () {
    $("modelBadge").textContent = $("model").value.trim() || "—";
  });

  inputEl.addEventListener("input", function () {
    autoGrow();
    updateSendState();
  });

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!busy) sendMessage();
    }
  });

  sendBtn.addEventListener("click", function () {
    if (busy) {
      if (controller) controller.abort();
    } else {
      sendMessage();
    }
  });

  messagesInner.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    inputEl.value = chip.textContent.trim();
    autoGrow();
    updateSendState();
    inputEl.focus();
  });

  // 侧栏开关
  function isMobile() { return window.matchMedia("(max-width: 880px)").matches; }

  $("menuBtn").addEventListener("click", function () {
    if (isMobile()) {
      app.classList.toggle("sidebar-open");
    } else {
      app.classList.toggle("sidebar-hidden");
    }
  });
  $("overlay").addEventListener("click", function () {
    app.classList.remove("sidebar-open");
  });

  // Ctrl/Cmd + K 聚焦输入框
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      inputEl.focus();
    }
    if (e.key === "Escape" && app.classList.contains("sidebar-open")) {
      app.classList.remove("sidebar-open");
    }
  });

  /* ---------------------------------------------------------------
   * 启动
   * ------------------------------------------------------------- */
  function init() {
    loadConfig();
    loadHistory();

    $("baseUrl").value = cfg.baseUrl || "";
    $("apiKey").value = cfg.apiKey || "";
    $("model").value = cfg.model || "";
    $("system").value = cfg.system || "";
    $("temperature").value = cfg.temperature;
    $("modelBadge").textContent = cfg.model || "—";
    $("sharedMeta").textContent = SHARED.baseUrl.replace(/^https?:\/\//, "");

    syncTempUI();
    applyLang(cfg.lang);
    renderAllMessages();
    autoGrow();
    updateSendState();
    setStatus("idle", t("settings.notTested"));

    if (isMobile()) app.classList.remove("sidebar-open");

    // 首次打开自动拉一次模型列表（静默）
    if (cfg.apiKey && cfg.baseUrl) {
      fetch(normalizeBase(cfg.baseUrl) + "/models", {
        headers: { "Authorization": "Bearer " + cfg.apiKey }
      }).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
        if (!data) return;
        var list = (data && (data.data || data.models)) || [];
        var ids = list.map(function (m) { return m && (m.id || m.name); }).filter(Boolean);
        var dl = $("modelList");
        ids.forEach(function (id) {
          var opt = document.createElement("option");
          opt.value = id;
          dl.appendChild(opt);
        });
      }).catch(function () {});
    }
  }

  init();
})();
</script>
</body>
